spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:kulha}
    password: ${RABBITMQ_PASSWORD:kulha-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
  config:
    import: optional:file:.env[.properties]
  application:
    name: kulha-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kulha}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      # Retire idle connections before typical managed-PostgreSQL/network idle limits.
      # Keepalive validates idle pooled connections so dead TCP sessions are replaced early.
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1740000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:120000}
      validation-timeout: ${DB_CONNECTION_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:8000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:8000}
          ssl:
            checkserveridentity: true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  http:
    max-body-bytes: ${APP_HTTP_MAX_BODY_BYTES:1048576}
  offer:
    reservation-cutoff-minutes: ${APP_OFFER_RESERVATION_CUTOFF_MINUTES:30}
    expiry-delay-ms: ${APP_OFFER_EXPIRY_DELAY_MS:60000}
    expiry-job-enabled: ${APP_OFFER_EXPIRY_JOB_ENABLED:true}
  search:
    elasticsearch:
      url: ${ELASTICSEARCH_URL:http://localhost:9200}
      index: ${ELASTICSEARCH_OFFERS_INDEX:kulha-offers-v3}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      replicas: ${ELASTICSEARCH_REPLICAS:0}
      connect-timeout-ms: ${ELASTICSEARCH_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${ELASTICSEARCH_READ_TIMEOUT_MS:10000}
      refresh-after-write: ${ELASTICSEARCH_REFRESH_AFTER_WRITE:false}
      retry-delay-ms: ${ELASTICSEARCH_RETRY_DELAY_MS:1000}
      initial-delay-ms: ${ELASTICSEARCH_INITIAL_DELAY_MS:1000}
      sync-events: ${ELASTICSEARCH_SYNC_EVENTS:false}
      rebuild-on-startup: ${ELASTICSEARCH_REBUILD_ON_STARTUP:true}
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  rate-limit:
    bff-secret: ${KULHA_BFF_SHARED_SECRET:}
  mail:
    from: ${MAIL_FROM:no-reply@kulha.local}

  security:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:kulha-api}
      audience: ${APP_SECURITY_JWT_AUDIENCE:kulha-clients}
      access-ttl-minutes: ${APP_SECURITY_JWT_ACCESS_TTL_MINUTES:10}
      key-id: ${APP_SECURITY_JWT_KEY_ID:kulha-primary}
      private-key-base64: ${APP_SECURITY_JWT_PRIVATE_KEY_BASE64:}
      public-key-base64: ${APP_SECURITY_JWT_PUBLIC_KEY_BASE64:}
      allow-ephemeral-key: ${APP_SECURITY_JWT_ALLOW_EPHEMERAL_KEY:false}
