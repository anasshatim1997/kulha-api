spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: kulha-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kulha}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:8000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:8000}
          ssl:
            checkserveridentity: true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  http:
    max-body-bytes: ${APP_HTTP_MAX_BODY_BYTES:1048576}
  offer:
    reservation-cutoff-minutes: ${APP_OFFER_RESERVATION_CUTOFF_MINUTES:30}
    expiry-delay-ms: ${APP_OFFER_EXPIRY_DELAY_MS:60000}
  web-base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  rate-limit:
    bff-secret: ${KULHA_BFF_SHARED_SECRET:}
  mail:
    from: ${MAIL_FROM:no-reply@kulha.local}

  security:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:kulha-api}
      audience: ${APP_SECURITY_JWT_AUDIENCE:kulha-clients}
      access-ttl-minutes: ${APP_SECURITY_JWT_ACCESS_TTL_MINUTES:10}
      key-id: ${APP_SECURITY_JWT_KEY_ID:kulha-primary}
      private-key-base64: ${APP_SECURITY_JWT_PRIVATE_KEY_BASE64:}
      public-key-base64: ${APP_SECURITY_JWT_PUBLIC_KEY_BASE64:}
      allow-ephemeral-key: ${APP_SECURITY_JWT_ALLOW_EPHEMERAL_KEY:false}
