# Test profile: self-contained, so the suite does not depend on a local .env file or on
# ADMIN_BOOTSTRAP_* / JWT key variables that happen to be set on a developer machine.
# NOTE: this file must be saved as UTF-8 *without* BOM.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_TEST:kulha_test}
    username: ${DB_USER_TEST:${DB_USER:postgres}}
    password: ${DB_PASSWORD_TEST:${DB_PASSWORD:postgres}}
  mail:
    host: localhost
    port: 1025
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      repositories:
        enabled: false

app:
  offer:
    # Avoid the real scheduled expiry worker racing deterministic manual expiry tests.
    # The job remains enabled by default outside the test profile.
    expiry-job-enabled: false
  web-base-url: http://localhost:3000
  mail:
    from: no-reply@kulha.local

  security:
    jwt:
      # Always generate an ephemeral key in tests, even if a .env defines real keys.
      private-key-base64: ""
      public-key-base64: ""
      allow-ephemeral-key: true

  rate-limit:
    enabled: false
  search:
    elasticsearch:
      # Integration tests must never clear or write the normal application index.
      url: http://localhost:9200
      # Bump the test index name when Elasticsearch field types change. Existing indices
      # cannot change a field from float to scaled_float in place. Keep the old index untouched.
      index: kulha-offers-test-v2
      replicas: 0
      refresh-after-write: true
      initial-delay-ms: 86400000
      sync-events: true
      rebuild-on-startup: false

# Never bootstrap an admin while the test context starts.
ADMIN_BOOTSTRAP_EMAIL: ""
ADMIN_BOOTSTRAP_PASSWORD: ""
