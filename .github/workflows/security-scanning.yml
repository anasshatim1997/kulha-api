name: API verification and security scans

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Maven verification
        run: ./mvnw --batch-mode clean verify
      - name: Dependency vulnerability scan
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.2
          "$(go env GOPATH)/bin/osv-scanner" scan source -r .
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose
      - name: Container image build and scan
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No root Dockerfile is present; image scan is not applicable to this source export."
            exit 0
          fi
          docker build --pull -t kulha-api-ci:${GITHUB_SHA} .
          go install github.com/aquasecurity/trivy/cmd/trivy@v0.58.1
          "$(go env GOPATH)/bin/trivy" image --exit-code 1 --severity CRITICAL,HIGH kulha-api-ci:${GITHUB_SHA}
