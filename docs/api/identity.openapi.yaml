openapi: 3.1.0
info:
  title: KULHA! Identity and Account API
  version: 1.0.0
  description: Authenticated account profile operations. Email and roles are not editable through the profile endpoint.
servers:
  - url: /api/v1
paths:
  /me:
    get:
      operationId: getMyProfile
      summary: Read the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required
    put:
      operationId: updateMyProfile
      summary: Update the authenticated user's name and phone number
      description: The user ID is taken from the validated access token. Email address, roles, verification state and account status cannot be changed through this operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Invalid profile data
        '401':
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UpdateMeRequest:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 30
    MeResponse:
      type: object
      required:
        - id
        - email
        - fullName
        - emailVerified
        - roles
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: [string, 'null']
        emailVerified:
          type: boolean
        roles:
          type: array
          items:
            type: string
