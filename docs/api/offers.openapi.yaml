openapi: 3.1.0
info:
  title: KULHA Offers API
  version: 1.0.0
  description: Public customer discovery and merchant offer management endpoints for KULHA! pickup-only MVP.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /offers:
    get:
      operationId: listPublicOffers
      summary: Search published offers available for pickup
      security: []
      parameters:
        - in: query
          name: q
          description: Search is performed by Elasticsearch over offer title, description and approved merchant/location fields, with fuzzy matching and structured filters. Results are re-hydrated from PostgreSQL before they are returned.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/OfferCategory' }
        - in: query
          name: maxPriceMinor
          schema: { type: integer, minimum: 100, maximum: 200000 }
        - in: query
          name: pickupFrom
          schema: { type: string, format: date-time }
        - in: query
          name: pickupTo
          schema: { type: string, format: date-time }
        - in: query
          name: city
          schema: { type: string, maxLength: 80 }
        - in: query
          name: district
          schema: { type: string, maxLength: 80 }
        - in: query
          name: availableOnly
          schema: { type: boolean, default: true }
        - in: query
          name: sort
          schema: { type: string, enum: [pickup_end, price, newest, savings, low_stock], default: pickup_end }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Paginated public offers
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicOfferPage' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '429':
          description: Search rate limit exceeded
          headers:
            Retry-After:
              description: Seconds before another search request is permitted
              schema: { type: integer, minimum: 1 }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /offers/nearby:
    post:
      operationId: searchNearbyPublicOffers
      summary: Find live baskets within a radius, ordered by physical distance
      description: Customer coordinates are supplied for this request only and are not persisted. The endpoint returns only offers whose approved merchant has a stored shop location. Requests are rate-limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                radiusMeters: { type: integer, minimum: 100, maximum: 25000, default: 5000 }
                q: { type: string, maxLength: 80 }
                category: { $ref: '#/components/schemas/OfferCategory' }
                maxPriceMinor: { type: integer, minimum: 100, maximum: 200000 }
                pickupFrom: { type: string, format: date-time }
                pickupTo: { type: string, format: date-time }
                availableOnly: { type: boolean, default: true }
                page: { type: integer, minimum: 0, default: 0 }
                size: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Nearby public baskets, ordered nearest first, with rounded distance in kilometres
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicOfferPage' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '429':
          description: Nearby search rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /offers/suggestions:
    get:
      operationId: suggestPublicOffers
      summary: Return short autocomplete suggestions for live public baskets
      description: Suggestions use Elasticsearch prefix matching and locale-aware analyzers across published offer titles and approved merchant/location names. Results exclude expired, sold-out, and non-approved offers and are limited to eight.
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - in: query
          name: city
          schema: { type: string, maxLength: 80 }
        - in: query
          name: district
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 8, default: 6 }
      responses:
        '200':
          description: Ranked live basket suggestions
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PublicOfferSuggestion' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '429':
          description: Suggestion rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /offers/{id}:
    get:
      operationId: getPublicOffer
      summary: Get a published offer and public pickup details
      security: []
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Public offer detail
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicOfferDetail' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /merchants/apply:
    post:
      operationId: applyAsMerchant
      summary: Apply as a merchant with public shop details and optional map pin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantProfileWrite' }
      responses:
        '201': { description: Application submitted, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantProfile' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /merchants/me:
    get:
      operationId: getOwnMerchantProfile
      responses:
        '200': { description: Merchant profile, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantProfile' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateOwnMerchantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantProfileWrite' }
      responses:
        '200': { description: Updated merchant profile, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantProfile' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /merchants/me/offers:
    post:
      operationId: createMerchantOffer
      summary: Create a draft offer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferWrite' }
      responses:
        '201':
          description: Draft created
          content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listMerchantOffers
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/OfferStatus' }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Paginated offer summaries
          content: { application/json: { schema: { $ref: '#/components/schemas/OfferPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /merchants/me/offers/{id}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      operationId: getMerchantOffer
      responses:
        '200': { description: Offer, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: editMerchantOffer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OfferWrite' } } }
      responses:
        '200': { description: Updated offer, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: cancelDraftOffer
      responses:
        '204': { description: Draft cancelled }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /merchants/me/offers/{id}/publish:
    post:
      operationId: publishMerchantOffer
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      responses:
        '200': { description: Published offer, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /merchants/me/offers/{id}/unpublish:
    post:
      operationId: unpublishMerchantOffer
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      responses:
        '200': { description: Unpublished offer, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /merchants/me/offers/{id}/duplicate:
    post:
      operationId: duplicateMerchantOffer
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: New draft with no pickup window, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/offers/{id}/suspend:
    post:
      operationId: suspendOffer
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } }
      responses:
        '200': { description: Suspended offer }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/offers/{id}/reinstate:
    post:
      operationId: reinstateOffer
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } }
      responses:
        '200': { description: Reinstated offer (UNPUBLISHED) }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/offers/{id}/history:
    get:
      operationId: getOfferAuditHistory
      parameters: [{ $ref: '#/components/parameters/OfferId' }]
      responses:
        '200': { description: Append-only audit history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OfferId: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: false, schema: { type: string, maxLength: 128 }, description: 'Optional idempotency key, scoped to the authenticated actor. Same key and same request replays the original 201 response; same key with a different request returns 409.' }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    MerchantProfileWrite:
      type: object
      required: [name, businessType, address, city, phone, openingHours]
      properties:
        name: { type: string, maxLength: 120 }
        businessType: { type: string, enum: [BAKERY, CAFE, RESTAURANT, SUPERMARKET, OTHER] }
        address: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 80 }
        district: { type: [string, 'null'], maxLength: 80 }
        phone: { type: string, maxLength: 30 }
        openingHours: { type: string, maxLength: 500 }
        pickupInstructions: { type: [string, 'null'], maxLength: 500 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: Optional shop latitude; send together with longitude }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180, description: Optional shop longitude; send together with latitude }
    MerchantProfile:
      allOf:
        - $ref: '#/components/schemas/MerchantProfileWrite'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PENDING, APPROVED, REJECTED, SUSPENDED] }
            decisionReason: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
    PublicMerchant:
      type: object
      required: [name, address, city]
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        district: { type: [string, 'null'] }
        pickupInstructions: { type: [string, 'null'] }
    PublicOfferSuggestion:
      type: object
      required: [id, title, category, priceMinor, merchantName, city]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: '#/components/schemas/OfferCategory' }
        priceMinor: { type: integer, minimum: 0, description: MAD minor units }
        merchantName: { type: string }
        city: { type: string }
        district: { type: [string, 'null'] }
    PublicOfferSummary:
      type: object
      required: [id, title, category, priceMinor, quantityTotal, availableUnits, pickupStart, pickupEnd, merchant]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: '#/components/schemas/OfferCategory' }
        priceMinor: { type: integer, minimum: 0, description: MAD centimes }
        originalPriceMinor: { type: [integer, 'null'] }
        quantityTotal: { type: integer }
        availableUnits: { type: integer, minimum: 0, description: Computed in PostgreSQL as quantity_total - quantity_reserved }
        pickupStart: { type: string, format: date-time }
        pickupEnd: { type: string, format: date-time }
        merchant: { $ref: '#/components/schemas/PublicMerchant' }
        distanceKm: { type: [number, 'null'], minimum: 0, description: Rounded distance in kilometres; present only on nearby-search responses }
        publishedAt: { type: [string, 'null'], format: date-time, description: Publication timestamp used by the Just added discovery highlight }
    PublicOfferDetail:
      allOf:
        - $ref: '#/components/schemas/PublicOfferSummary'
        - type: object
          required: [description, allergensStatus, allergens]
          properties:
            description: { type: string }
            allergensStatus: { $ref: '#/components/schemas/AllergensStatus' }
            allergens: { type: array, items: { type: string } }
            foodNotes: { type: [string, 'null'] }
    PublicOfferPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicOfferSummary' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    OfferStatus: { type: string, enum: [DRAFT, PUBLISHED, UNPUBLISHED, SUSPENDED, EXPIRED, CANCELLED] }
    OfferCategory: { type: string, enum: [BREAD_PASTRY, PREPARED_MEALS, GROCERIES, FRUIT_VEG, DRINKS, SURPRISE_BASKET, OTHER] }
    AllergensStatus: { type: string, enum: [UNKNOWN, DECLARED] }
    OfferWrite:
      type: object
      required: [title, description, category, priceMinor, quantityTotal, allergensStatus]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        category: { $ref: '#/components/schemas/OfferCategory' }
        priceMinor: { type: integer, minimum: 100, maximum: 200000, description: MAD centimes }
        originalPriceMinor: { type: [integer, 'null'], minimum: 100, maximum: 200000 }
        quantityTotal: { type: integer, minimum: 1, maximum: 500 }
        pickupStart: { type: [string, 'null'], format: date-time }
        pickupEnd: { type: [string, 'null'], format: date-time }
        allergensStatus: { $ref: '#/components/schemas/AllergensStatus' }
        allergens: { type: array, items: { type: string, enum: [GLUTEN, CRUSTACEANS, EGGS, FISH, PEANUTS, SOY, MILK, NUTS, CELERY, MUSTARD, SESAME, SULPHITES, LUPIN, MOLLUSCS] } }
        foodNotes: { type: [string, 'null'], maxLength: 500 }
        version: { type: [integer, 'null'], minimum: 0 }
    Offer:
      allOf:
        - $ref: '#/components/schemas/OfferWrite'
        - type: object
          required: [id, merchantId, quantityReserved, availableUnits, status, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            merchantId: { type: string, format: uuid }
            quantityReserved: { type: integer }
            availableUnits: { type: integer }
            status: { $ref: '#/components/schemas/OfferStatus' }
            publishedAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    OfferPage:
      type: object
      properties:
        items: { type: array, items: { type: object } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    Reason:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        reason: { type: [string, 'null'] }
        result: { type: string }
        correlationId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        code: { type: string, description: Stable machine-readable error code }
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
          description: Present on 422 validation responses; maps request field names to validation messages.
